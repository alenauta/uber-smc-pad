    .bg-veil { fill: #FFFFFF; fill-opacity: 0; pointer-events: none; }
    .panel-sub { fill: #F8FAFC; }
    .box-bg { fill: #F8FAFC; stroke: #475569; stroke-width: 0.16; }
    .box-alt { fill: #F1F5F9; stroke: #475569; stroke-width: 0.15; }
    .cad-grid-lines { display: none; }
    .grid-min { stroke: #EDF2F7; stroke-width: 0.07; fill: none; }
    .grid-maj { stroke: #CBD5E1; stroke-width: 0.12; fill: none; }
    .sc-trace { stroke: #94A3B8; stroke-width: 0.18; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sc-rule { stroke: #475569; fill: none; }
    .sc-rule-hi { stroke: #0F172A; fill: none; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    .step-c { fill: #EA580C; }
    .step-bg { fill: #EA580C; }
    .step-fg { fill: #FFFFFF; }
    .pat-c { fill: #0284C7; }
    .warn-c { fill: #CA8A04; }
    .warn-stroke { stroke: #CA8A04; fill: none; }
    .ok-c { fill: #16A34A; }
    .f-cond { font-family: "Roboto Condensed", "Avenir Next Condensed", "Bahnschrift", "Liberation Sans Narrow", "Arial Narrow", sans-serif; }
    .f-mono { font-family: "Noto Sans Mono", "JetBrains Mono", "SF Mono", "DejaVu Sans Mono", "Liberation Mono", monospace; }
    </style>
